name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    # A false/unset flag means NOT_RUN, never CI acceptance. D1 prohibits paid compute.
    if: vars.CLAVIS_FREE_CI_CONFIRMED == 'true'
    name: quality (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: false
      - run: uv sync --locked --all-groups
      - run: uv run --locked --all-groups ruff check .
      - run: uv run --locked --all-groups ruff format --check .
      - run: uv run --locked --all-groups mypy
      - run: uv run --locked --all-groups pytest tests/ --cov=clavis --cov=scripts --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - run: uv run --locked --all-groups lint-imports
      - name: Runtime dependency license allowlist
        run: uv run --locked --all-groups python scripts/check_licenses.py
      - name: Contract schema validation
        run: uv run --locked --all-groups pytest tests/contracts
      - name: Required H1-H9 AST scan
        run: uv run --locked --all-groups python -m eval.integrity.hardcode_scan --root . --out work/hardcode.json
      - name: Required integrity positive and negative tests
        run: uv run --locked --all-groups pytest tests/eval/test_integrity.py
      - name: Evaluation coverage (independent 80 percent gate)
        env:
          COVERAGE_FILE: .coverage.eval
        run: uv run --locked --all-groups pytest tests/eval --cov=eval --cov-report=term-missing --cov-report=xml:work/eval-coverage.xml --cov-fail-under=80
      - name: Integrity evidence and real-data NOT_RUN status
        run: uv run --locked --all-groups python scripts/integrity_status.py --ast-report work/hardcode.json --out work/integrity-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            coverage.xml
            work/eval-coverage.xml
            work/hardcode.json
            work/integrity-status.json
          retention-days: 7
