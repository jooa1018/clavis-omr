name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    name: Route jobs and lightweight document checks
    if: vars.CLAVIS_FREE_CI_CONFIRMED == 'true' && github.event_name != 'push' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      quality: ${{ steps.plan.outputs.quality }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci_plan.py
  quality:
    needs: plan
    if: ${{ !cancelled() && vars.CLAVIS_FREE_CI_CONFIRMED == 'true' && (github.event_name == 'push' || needs.plan.outputs.quality == 'true') }}
    name: quality (${{ matrix.os }}, Python 3.12)
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix || '{"os":["ubuntu-latest"]}') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: ${{ hashFiles('uv.lock') }}
      - run: uv sync --locked --all-groups
      - name: Lock reproducibility
        run: git diff --exit-code -- uv.lock
      - run: uv run --locked --all-groups ruff check .
      - run: uv run --locked --all-groups ruff format --check .
      - run: uv run --locked --all-groups mypy
      - name: All tests (once, including contracts and integrity)
        run: uv run --locked --all-groups pytest tests/ --cov=clavis --cov=scripts --cov=eval --cov-report=term-missing --cov-report=xml --cov-report=json:work/coverage.json --junitxml=work/tests.xml
      - name: Independent coverage gates (overall, platform, eval >=80%)
        if: ${{ !cancelled() }}
        run: uv run --locked --all-groups python scripts/ci_results.py coverage work/coverage.json
      - name: Required contract and integrity positive/negative results
        if: ${{ !cancelled() }}
        run: uv run --locked --all-groups python scripts/ci_results.py required work/tests.xml
      - run: uv run --locked --all-groups lint-imports
      - name: Runtime dependency license allowlist
        run: uv run --locked --all-groups python scripts/check_licenses.py
      - name: Required H1-H9 AST scan
        run: uv run --locked --all-groups python -m eval.integrity.hardcode_scan --root . --out work/hardcode.json
      - name: Integrity evidence and real-data NOT_RUN status
        run: uv run --locked --all-groups python scripts/integrity_status.py --ast-report work/hardcode.json --out work/integrity-status.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}
          path: |
            coverage.xml
            work/coverage.json
            work/tests.xml
            work/hardcode.json
            work/integrity-status.json
          retention-days: 7
